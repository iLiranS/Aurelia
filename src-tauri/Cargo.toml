[package]
name = "aurelia"
version = "0.1.0"
description = "A fast, native-feeling desktop MIDI piano visualizer and practice app"
authors = ["Aurelia Team"]
license = "GPL-3.0-only"
edition = "2021"

[lib]
name = "aurelia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
midly = "0.5"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
notify = "6"
blake3 = "1"
cpal = "0.15"
rustysynth = "1.3"
crossbeam-channel = "0.5"
midir = "0.10"
hound = "3.5"
mp3lame-encoder = "0.2"
